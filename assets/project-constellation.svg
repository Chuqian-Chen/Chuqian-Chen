      <rect width="320" height="112" rx="18" fill="url(#card)" stroke="#FB7185" stroke-opacity=".55"/>
      <text x="20" y="32" fill="#F8FFFF" font-size="17" font-weight="700">Mayo NIV Prediction</text>
      <text x="20" y="58" fill="#BFE7E8" font-size="13">XGBoost + SHAP + ICU timelines</text>
      <text x="20" y="80" fill="#BFE7E8" font-size="13">AUC 0.81, recall 71%</text>
      <text x="20" y="100" fill="#9FFCF0" font-size="13">clinical ML under imbalance</text>
    </g>

