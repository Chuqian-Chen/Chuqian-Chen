<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="78%">
      <stop stop-color="#123145"/>
      <stop offset="0.52" stop-color="#081D2B"/>
      <stop offset="1" stop-color="#050B18"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.13 0 0 0 0 0.83 0 0 0 0 0.93 0 0 0 0.75 0"/>
      <feBlend in2="SourceGraphic" mode="screen"/>
    </filter>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0B2B36"/>
      <stop offset="1" stop-color="#101936"/>
    </linearGradient>
    <linearGradient id="orbit" x1="115" y1="310" x2="1085" y2="310">
      <stop stop-color="#34D399"/>
      <stop offset=".46" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>

  <g opacity=".45">
    <circle cx="154" cy="86" r="2" fill="#BFE7E8"/>
    <circle cx="264" cy="172" r="1.5" fill="#BFE7E8"/>
    <circle cx="1040" cy="82" r="2" fill="#BFE7E8"/>
    <circle cx="1110" cy="344" r="1.5" fill="#BFE7E8"/>
    <circle cx="840" cy="522" r="2" fill="#BFE7E8"/>
    <circle cx="468" cy="536" r="1.5" fill="#BFE7E8"/>
    <circle cx="90" cy="480" r="2" fill="#BFE7E8"/>
    <circle cx="602" cy="96" r="1.8" fill="#BFE7E8"/>
