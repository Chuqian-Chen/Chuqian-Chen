      <text x="20" y="58" fill="#BFE7E8" font-size="13">local data QC and cleaning workbench</text>
      <text x="20" y="80" fill="#BFE7E8" font-size="13">raw stays unchanged, output iterates</text>
      <text x="20" y="100" fill="#9FFCF0" font-size="13">AI proposals + human review</text>
    </g>

    <g transform="translate(456 132)">
