  <text x="70" y="66" fill="#9FFCF0" font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="700">PROJECT CONSTELLATION</text>
  <text x="70" y="110" fill="#F8FFFF" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700">Applied AI systems around one core</text>
  <text x="70" y="142" fill="#BFE7E8" font-family="Consolas, 'Courier New', monospace" font-size="17">clinical data engineering * interpretable ML * knowledge graphs * local tools * agent graphs</text>

  <g stroke="url(#orbit)" stroke-opacity=".26" stroke-width="2">
    <path d="M600 318L252 260"/>
    <path d="M600 318L334 470"/>
    <path d="M600 318L596 180"/>
    <path d="M600 318L852 198"/>
    <path d="M600 318L950 336"/>
    <path d="M600 318L760 496"/>
  </g>

  <g filter="url(#glow)">
    <circle cx="600" cy="318" r="74" fill="#061A1A" fill-opacity=".86" stroke="#22D3EE" stroke-opacity=".72"/>
    <circle cx="600" cy="318" r="88" stroke="#22D3EE" stroke-opacity=".25">
      <animate attributeName="r" values="82;96;82" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".25;.65;.25" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="600" y="306" fill="#F8FFFF" font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="700" text-anchor="middle">Chuqian</text>
  <text x="600" y="332" fill="#9FFCF0" font-family="Consolas, 'Courier New', monospace" font-size="14" text-anchor="middle">medical AI builder</text>

  <g font-family="Consolas, 'Courier New', monospace">
    <g transform="translate(82 212)">
      <rect width="318" height="112" rx="18" fill="url(#card)" stroke="#34D399" stroke-opacity=".55"/>
