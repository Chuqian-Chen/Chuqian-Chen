      <text x="20" y="58" fill="#BFE7E8" font-size="13">900+ cohort + literature evidence</text>
      <text x="20" y="80" fill="#BFE7E8" font-size="13">fixed ML probability handoff</text>
      <text x="20" y="100" fill="#9FFCF0" font-size="13">LLM explains, never invents risk</text>
