      <text x="20" y="58" fill="#BFE7E8" font-size="13">DICOM, OCT, fundus images</text>
      <text x="20" y="80" fill="#BFE7E8" font-size="13">Spark / Hive multimodal warehouse</text>
      <text x="20" y="100" fill="#9FFCF0" font-size="13">92% data completeness</text>
    </g>

