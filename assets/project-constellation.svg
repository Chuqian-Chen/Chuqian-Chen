      <text x="20" y="32" fill="#F8FFFF" font-size="17" font-weight="700">Medical NL-to-SQL</text>
      <text x="20" y="58" fill="#BFE7E8" font-size="13">MIMIC-IV + schema retrieval</text>
      <text x="20" y="80" fill="#BFE7E8" font-size="13">SQL verification and rewrite loop</text>
      <text x="20" y="100" fill="#9FFCF0" font-size="13">83% complex JOIN accuracy</text>
