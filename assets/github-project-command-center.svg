<svg width="1200" height="540" viewBox="0 0 1200 540" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="540">
      <stop stop-color="#050B18"/>
      <stop offset="0.48" stop-color="#092433"/>
      <stop offset="1" stop-color="#101936"/>
    </linearGradient>
    <linearGradient id="wire" x1="120" y1="270" x2="1080" y2="270">
      <stop stop-color="#34D399"/>
      <stop offset="0.52" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0B2B36"/>
      <stop offset="1" stop-color="#101936"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.13 0 0 0 0 0.83 0 0 0 0 0.93 0 0 0 .75 0"/>
      <feBlend in2="SourceGraphic" mode="screen"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#E8FFFF" stroke-opacity=".055"/>
    </pattern>
  </defs>

  <rect width="1200" height="540" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="540" rx="28" fill="url(#grid)"/>

  <g opacity=".48">
    <circle cx="118" cy="91" r="2" fill="#BFE7E8"/>
    <circle cx="226" cy="430" r="1.6" fill="#BFE7E8"/>
    <circle cx="1048" cy="94" r="2.2" fill="#BFE7E8"/>
    <circle cx="1108" cy="446" r="1.6" fill="#BFE7E8"/>
    <circle cx="608" cy="82" r="1.8" fill="#BFE7E8"/>
    <circle cx="612" cy="480" r="1.8" fill="#BFE7E8"/>
  </g>

  <text x="70" y="62" fill="#9FFCF0" font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="700">PUBLIC REPO COMMAND CENTER</text>
  <text x="70" y="106" fill="#F8FFFF" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700">From research workflow to runnable tools</text>
  <text x="70" y="138" fill="#BFE7E8" font-family="Consolas, 'Courier New', monospace" font-size="16">profile repo + data workbench + LangGraph demo + algorithm practice + private clinical KG system</text>

  <g stroke="url(#wire)" stroke-width="3" stroke-linecap="round" opacity=".72" filter="url(#glow)">
    <path d="M275 278C365 180 450 210 525 270"/>
    <path d="M525 270C602 330 692 326 776 260"/>
    <path d="M776 260C868 188 950 208 1030 280"/>
    <path d="M525 270C494 384 394 424 274 396"/>
    <path d="M776 260C812 386 908 418 1030 394"/>
  </g>

  <g filter="url(#glow)">
    <circle cx="525" cy="270" r="12" fill="#22D3EE">
      <animate attributeName="r" values="10;15;10" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".7;1;.7" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="776" cy="260" r="12" fill="#A78BFA">
      <animate attributeName="r" values="9;14;9" dur="3.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".65;1;.65" dur="3.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g font-family="Consolas, 'Courier New', monospace">
    <g transform="translate(70 198)">
      <rect width="310" height="124" rx="18" fill="url(#card)" stroke="#34D399" stroke-opacity=".56"/>
      <text x="22" y="34" fill="#F8FFFF" font-size="18" font-weight="700">preprocess-ui</text>
      <text x="22" y="60" fill="#BFE7E8" font-size="13">CSV import -> field profiling -> QC</text>
      <text x="22" y="82" fill="#BFE7E8" font-size="13">AI-reviewed JSON cleaning operations</text>
      <text x="22" y="104" fill="#9FFCF0" font-size="13">FastAPI + Chart.js + Mermaid</text>
    </g>

    <g transform="translate(430 188)">
      <rect width="300" height="136" rx="18" fill="url(#card)" stroke="#22D3EE" stroke-opacity=".56"/>
      <text x="22" y="34" fill="#F8FFFF" font-size="18" font-weight="700">Chuqian-Chen profile</text>
      <text x="22" y="60" fill="#BFE7E8" font-size="13">visual README system map</text>
      <text x="22" y="82" fill="#BFE7E8" font-size="13">clinical AI + data engineering identity</text>
      <text x="22" y="104" fill="#9FFCF0" font-size="13">recruiter-readable evidence cards</text>
    </g>

    <g transform="translate(790 198)">
      <rect width="340" height="124" rx="18" fill="url(#card)" stroke="#A78BFA" stroke-opacity=".56"/>
      <text x="22" y="34" fill="#F8FFFF" font-size="18" font-weight="700">langgraph-agent-demo</text>
      <text x="22" y="60" fill="#BFE7E8" font-size="13">START -> mock_llm -> END</text>
      <text x="22" y="82" fill="#BFE7E8" font-size="13">MessagesState, runnable graph, CLI trace</text>
      <text x="22" y="104" fill="#9FFCF0" font-size="13">unit-tested agent-loop basics</text>
    </g>

    <g transform="translate(110 370)">
      <rect width="294" height="92" rx="18" fill="#061A1A" fill-opacity=".78" stroke="#FBBF24" stroke-opacity=".5"/>
      <text x="22" y="34" fill="#F8FFFF" font-size="17" font-weight="700">Learn_git</text>
      <text x="22" y="58" fill="#BFE7E8" font-size="13">Git workflow + algorithm practice</text>
      <text x="22" y="78" fill="#9FFCF0" font-size="13">fundamentals kept active</text>
    </g>

    <g transform="translate(674 370)">
      <rect width="420" height="92" rx="18" fill="#061A1A" fill-opacity=".78" stroke="#FB7185" stroke-opacity=".5"/>
      <text x="22" y="34" fill="#F8FFFF" font-size="17" font-weight="700">Private HSCT KG explainability</text>
      <text x="22" y="58" fill="#BFE7E8" font-size="13">ML probability + EHR/literature evidence + controlled explanation</text>
      <text x="22" y="78" fill="#9FFCF0" font-size="13">FastAPI + local index fallback + clinician-facing UI</text>
    </g>
